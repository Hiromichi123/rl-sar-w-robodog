# 物资装卸搬运各专项作业安全交底口播(全套完整版)
# 每个 section 是一段独立完整口播(开场→通用要求→专项逐条条款→应急→结语)
# 触发: 用户说"我要开始XX作业",按关键词匹配;说"全部/完整交底"或不指定类型则连播全部
# lines 已按口语短句切分、数字转中文、重点条款逐条编号,直接逐句送 TTS
# speed: 交底播报语速(比日常聊天慢,句首字更清晰,减少吞字);1.0=正常,越小越慢
# short: 专项短名称,用于交底前导语"对XX作业开始交底/开始逐项交底"
speed: 1.0
sections:
  - id: elevator
    name: 货运电梯作业
    short: 货运电梯
    keywords: [货运电梯, 电梯, 货梯]
    lines:
      - 现在开展货运电梯装卸作业安全交底，请所有现场作业人员、监护人员认真聆听、严格执行！
      - 此次作业已明确工作负责人及专职监护人，全程必须持证监护作业，严禁无监护、私自操作电梯设备。
      - 作业前，请全体人员规范穿戴工作服、防砸工作鞋、安全帽，确认个人防护用品齐全有效、穿戴到位。
      - 提前检查货运电梯运行状态、轿厢、开关、防护装置，确认完好无故障，作业相关表单齐全完备。
      - 现将货运电梯作业核心安全要求，逐条明确如下。
      - 第一、装载货物时必须将货物摆放平稳，重心置于轿厢中部，保持轿厢整体平衡，杜绝偏载、斜载。
      - 第二、货运电梯严禁超载运行、严禁人货混载，仅限专项货物转运，禁止人员搭乘。
      - 第三、严禁利用货运电梯装运易燃易爆、腐蚀性等危险物品。
      - 第四、操作过程中若发现电梯异响、卡顿、故障、报警等任何异常情况，必须立即停止作业、停止设备运行，同时严禁私自检修、强行操作，第一时间上报负责人并联系专人处置。
      - 第五、作业全程遵守库区通用安全规定，库区全域严禁吸烟，严禁违规动火、违规操作。
      - 第六、如遇室外风力五级及以上、雷雨、高温四十摄氏度以上等恶劣天气，立即停止一切库区电梯装卸作业。
      - 第七、作业过程中杜绝打闹、闲谈、违规操作，严禁肢体、工具伸入电梯轿厢缝隙及运行区域。
      - 紧急情况处置：作业中出现磕碰、扭伤等轻微伤害，立即停工现场处置。
      - 发生夹伤、设备故障伤人等突发事故，立即停止设备、开展现场急救，必要时拨打一二零，并按流程上报。
      - 以上货运电梯作业安全要求，请所有人员严格遵守！
      - 交底结束，现场有无疑问？如无疑问，各岗位正式开始货运电梯作业！

  - id: forklift
    name: 叉车装卸作业
    short: 叉车
    # 含 ASR 常见误读: 插车/插收/查车(音同/近 chache), 铲车(同义俗称)
    keywords: [叉车, 插车, 插收, 查车, 铲车]
    lines:
      - 现在开展叉车装卸搬运作业安全交底，请所有叉车操作人员、现场配合人员、监护人员全员听清、严格落实！
      - 此次作业已明确工作负责人和专职监护人，全程作业必须有人监护，坚决杜绝无监护作业。
      - 作业前所有人员规范穿戴工作服、防砸鞋、安全帽，确认防护到位。
      - 叉车操作人员必须持有效特种设备操作证上岗，提前核查叉车检验合格证在有效期内。
      - 检查车辆刹车、转向、货叉、灯光、液压系统完好正常，确认无故障、无漏油、无破损，严禁叉车带病作业。
      - 现将叉车作业硬性安全规定，逐条明确如下。
      - 第一、作业人员严禁酒后开车，行驶、作业过程中严禁饮食、闲谈、接打手机及对讲机，杜绝一切分心操作。
      - 第二、叉车运行严禁载人、严禁超载，严格遵守叉车七不准作业准则。
      - 第三、作业现场多岗位协同作业时，提前划分作业区域，必要时设置安全围栏隔离，杜绝交叉作业风险。
      - 第四、夜间作业必须保障现场照明充足，视线不良立即停工。
      - 第五、库区全程禁烟，严禁违规作业。
      - 第六、环境温度超四十摄氏度、室外风力大于五级、雷雨等恶劣天气，立即停止所有叉车室外作业。
      - 第七、作业中发现车辆异常、货物不稳、现场隐患，立即停车熄火、停止作业，及时上报处置。
      - 叉车作业七不准具体要求。
      - 第一、不准货物举升超过五百毫米长距离行驶。
      - 第二、不准用货叉挑翻货盘。
      - 第三、不准直接铲运危险品。
      - 第四、不准单货叉开展作业。
      - 第五、不准依靠惯性装卸货物。
      - 第六、不准货叉带人，货叉升起后叉下禁止站人、维修。
      - 第七、不准用叉车拖拽其他车辆。
      - 现场配合人员严禁在叉车转弯半径、车辆前后盲区、行驶路径内停留、穿行、站立。
      - 如有轻微磕碰、擦伤，立即停工处理。
      - 发生货物坠落、车辆剐蹭、伤人事故，立即停机避险、急救处置，及时上报并按需就医。
      - 以上叉车作业安全纪律全员必须牢记执行！
      - 交底结束，现场有无疑问？如无疑问，各岗位正式开始叉车装卸作业！

  - id: lifting
    name: 起重机吊装装卸作业
    short: 起重机吊装
    # 含 ASR 常见误读: 掉装(音同 diaozhuang)
    keywords: [起重, 吊装, 掉装, 吊车, 起重机, 吊物, 吊臂]
    lines:
      - 现在开展起重机吊装装卸作业专项安全交底。
      - 请吊装指挥人员、操作人员、司索人员、现场监护及配合人员全部认真聆听、严格执行！
      - 此次吊装作业已明确专属工作负责人、专职安全监护人，全程闭环监护，严禁无监护、无交底擅自作业。
      - 所有现场人员必须规范穿戴工作服、防砸安全鞋、安全帽，个人防护必须到位。
      - 作业前核查起重机检验合格证、操作人员特种设备操作证均在有效期内。
      - 全面检查桥架、吊臂、支腿、吊绳、吊钩、锁具等关键部件，确认外观完好、性能可靠、无磨损、无断裂隐患。
      - 工器具、吊装辅具齐全完好，提前确认吊装作业方案、作业表单齐全，明确作业区域、指挥手势及信号。
      - 现将吊装作业核心安全要求，逐条明确如下。
      - 第一、作业全程听从统一指挥，全员动作协同一致，严禁私自操作、擅自指挥、擅自更改吊装方式。
      - 第二、作业过程中时刻观察设备及吊物状态，发现设备异响、晃动、吊物倾斜、绳具异常等任何隐患，必须立即停止作业、切断设备电源，人员撤离，隐患未消除严禁复工。
      - 第三、严格执行吊装红线禁令，吊装作业半径内、吊物下方、吊臂下方，严禁任何人停留、穿行、观望、作业，杜绝高空坠物伤人风险。
      - 第四、多作业同步开展时，必须设置硬质安全围栏做好区域隔离，规避交叉作业风险。
      - 第五、夜间吊装务必保障全方位照明充足，视线不足严禁作业。
      - 第六、室外风力大于五级、雷雨、暴雨、高温四十摄氏度以上等恶劣天气，立即停止所有室外吊装作业。
      - 第七、库区全程禁烟，严禁违规动火、违规逗留。
      - 应急处置：出现轻微磕碰、扭伤及时停工处置。
      - 发生吊物坠落、设备故障、人员受伤等突发事故，第一时间停机避险、开展现场急救，拨打一二零救助，并按规定逐级上报。
      - 以上吊装作业安全要求，全员务必严守！
      - 交底结束，现场有无疑问？如无疑问，各岗位正式开始起重机吊装装卸作业！

  - id: warehouse
    name: 库区常规装卸搬运作业
    short: 库区常规
    keywords: [库区, 仓库, 仓储, 库内, 入库, 常规]
    lines:
      - 现在开展库区常规物资装卸搬运作业安全交底，请全体作业、监护人员认真听讲、严格遵守！
      - 此次库区装卸作业已落实工作负责人、现场监护人，所有作业必须在监护下开展，严禁私自单人作业、无监护作业。
      - 作业前全员规范穿戴工作服、防砸工作鞋、安全帽，确认防护用品合格有效。
      - 提前检查手推车、托盘、撬棍等各类工器具完好无损，不合格工具一律禁止使用。
      - 备齐作业相关表单，确认此次装卸任务、作业方式清晰明确。
      - 现将库区常规装卸作业核心规定，逐条明确如下。
      - 第一、仓库全域为固定禁烟区域，现场全程严禁吸烟、严禁明火、严禁违规动火。
      - 第二、所有人员进入库区必须由仓管人员陪同，严禁私自进入库区、私自挪动物资、擅自走动逗留。
      - 第三、入库作业车辆全程听从仓管人员指挥，规范停靠、有序装卸，禁止随意停放、堵塞通道。
      - 第四、多人协同装卸时，统一口令、协同配合，轻拿轻放，杜绝野蛮搬运、抛扔物资，防止物资坠落、磕碰伤人。
      - 第五、现场存在两项及以上同步作业时，必须设置安全围栏做好区域隔离，防范交叉作业伤害。
      - 第六、夜间作业必须保证现场照明充足，昏暗区域禁止作业。
      - 第七、遇环境温度超四十摄氏度、室外风力大于五级、雷雨大风等恶劣天气，立即停止全部库区室外装卸作业，人员迅速撤离。
      - 应急处置：作业中出现轻微擦伤、扭伤，立即停工做现场简易处理。
      - 发生物资坠落伤人、中暑、磕碰重伤等事故，立即停止所有作业，开展现场急救，必要时拨打一二零，并及时上报主管部门。
      - 以上库区常规装卸作业安全要求全员落实到位！
      - 交底结束，现场有无疑问？如无疑问，各岗位正式开始库区常规装卸搬运作业！

  - id: height
    name: 高处装卸作业
    short: 高处
    # 含 ASR 常见误读: 当空(dangkong, 高空 gaokong 的 d/g 误识别)
    keywords: [高处, 高空, 当空, 登高, 安全带, 坠落]
    lines:
      - 现在开展高处物资装卸作业安全交底，请所有高处作业人员、下方监护人员、配合人员认真聆听、严格执行！
      - 此次高处装卸作业已明确工作负责人及专职监护人，全程专人监护，无监护坚决禁止高处作业。
      - 所有作业人员、监护人员必须规范穿戴全套劳保用品，工作服、防砸鞋、安全帽穿戴齐全、规范到位。
      - 作业前全面检查脚手架、作业平台、登高梯具、工器具，确认牢固完好、安全可靠，不合格设备及工具严禁投入使用。
      - 现将高处装卸作业硬性安全要求，逐条明确如下。
      - 第一、作业高度大于一点五米，必须全程正确佩戴安全带，严格遵循高挂低用原则，行走过程中严禁摘除安全带、严禁失去防护。
      - 第二、高处作业工具、物料必须定点放置、妥善固定，严禁随手抛掷工具、物资，严防高空坠物。
      - 第三、高处作业下方划定警戒区域，设置警示标识及隔离设施，禁止无关人员停留、穿行、围观，杜绝上下交叉作业风险。
      - 第四、夜间高处作业必须保障充足照明，光线不足、视线不良立即停工。
      - 第五、遇高温四十摄氏度以上、五级及以上大风、雷雨、雾天等恶劣天气，立即停止所有高处装卸作业，人员迅速撤离。
      - 第六、库区全程禁烟，严禁违规作业。
      - 作业中出现头晕、乏力、磕碰、划伤等情况，立即撤离高处作业区域，停工休整处置。
      - 应急处置：发生高空坠落、坠物伤人等突发事故，立即停止作业、开展现场急救，拨打一二零并按流程上报。
      - 所有人员务必严守高处作业安全规程！
      - 交底结束，现场有无疑问？如无疑问，各岗位正式开始高处装卸作业！

# 触发"完整/全部交底"的关键词(连播 5 个专项)
full_keywords: [全部, 所有, 完整, 整个, 全面, 全套, 整体, 各个, 每项]
